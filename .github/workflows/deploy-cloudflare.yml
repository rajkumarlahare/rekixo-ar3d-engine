name: Deploy Rekixo AR3D Engine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Admin-only is the safe default; engine-all also changes the public viewer and Engine infrastructure.
        type: choice
        required: true
        default: admin-only
        options:
          - admin-only
          - engine-all

concurrency:
  group: rekixo-3d-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify generalized Engine
        run: npm test

      - name: Require Cloudflare deployment secret
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Apply isolated D1 migrations
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'engine-all'
        run: >-
          npx --yes wrangler@4
          d1 migrations apply rekixo-3d-production
          --remote
          --config wrangler.infra.jsonc

      - name: Ensure isolated R2 bucket exists
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'engine-all'
        shell: bash
        run: |
          set -euo pipefail
          BUCKETS="$(npx --yes wrangler@4 r2 bucket list)"
          if printf '%s\n' "$BUCKETS" | grep -Fq "rekixo-3d-assets"; then
            echo "R2 bucket already exists: rekixo-3d-assets"
          else
            npx --yes wrangler@4 r2 bucket create rekixo-3d-assets
          fi

      - name: Prepare published designs and verify model checksums
        run: node scripts/prepare-published-designs.mjs

      - name: Deploy isolated 3D Admin Worker
        # Static publication assets are isolated from the existing D1/R2 project registry.
        # Preparation above must succeed before deploying this Worker.
        id: admin-deploy
        run: >-
          npx --yes wrangler@4
          deploy
          --config wrangler.admin.jsonc

      - name: Deploy isolated 3D Public Worker
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'engine-all'
        run: >-
          npx --yes wrangler@4
          deploy
          --config wrangler.public.jsonc

      - name: Verify deployed Design Admin entry and editor bundle
        run: node scripts/verify-design-admin.mjs

      - name: Verify generic admin project registry
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://admin.rekixo.com/3Dprojects/api/projects"
          STATUS="$(curl --location --silent --show-error --output /tmp/engine-projects.json --write-out '%{http_code}' "$API_URL" || true)"
          [ "$STATUS" = "200" ]
          grep -Fq '"projects":[' /tmp/engine-projects.json
          echo "Generic 3D project registry verified."

      - name: Verify Platform integration contract
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://admin.rekixo.com/3Dprojects/api/integration/projects/jyoti-paradise"
          HEADERS="$(mktemp)"
          STATUS="$(curl --location --silent --show-error --dump-header "$HEADERS" --output /tmp/engine-integration.json --write-out '%{http_code}' "$API_URL" || true)"
          [ "$STATUS" = "200" ]
          grep -Fqi 'x-rekixo-ar3d-contract: 1' "$HEADERS"
          grep -Fq '"contractVersion":1' /tmp/engine-integration.json
          grep -Fq '"slug":"jyoti-paradise"' /tmp/engine-integration.json
          echo "Platform ↔ Engine contract v1 verified."

      # Jyoti Paradise is the existing live compatibility fixture, not an Engine default.
      - name: Verify legacy Jyoti public production fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_SLUG="jyoti-paradise"
          PAGE_URL="https://ar3dstudio.in/3Dprojects/${FIXTURE_SLUG}"
          API_URL="https://ar3dstudio.in/3Dprojects/api/projects/${FIXTURE_SLUG}"
          ORIGIN="https://ar3dstudio.in"
          for attempt in 1 2 3 4 5; do
            PAGE="$(mktemp)"
            API="$(mktemp)"
            PAGE_STATUS="$(curl --location --silent --show-error --output "$PAGE" --write-out '%{http_code}' "$PAGE_URL" || true)"
            API_STATUS="$(curl --location --silent --show-error --output "$API" --write-out '%{http_code}' "$API_URL" || true)"
            ASSET_PATH="$(grep -oE 'src="/3Dprojects/assets/[^"]+\.js"' "$PAGE" | head -n1 | cut -d'"' -f2 || true)"
            ASSET_STATUS="000"
            ASSET_TYPE=""
            if [ -n "$ASSET_PATH" ]; then
              ASSET_META="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}|%{content_type}' "${ORIGIN}${ASSET_PATH}" || true)"
              ASSET_STATUS="${ASSET_META%%|*}"
              ASSET_TYPE="${ASSET_META#*|}"
            fi
            if [ "$PAGE_STATUS" = "200" ] \
              && grep -Fq '<title>AR3D Studio 3D Project</title>' "$PAGE" \
              && [ "$API_STATUS" = "200" ] \
              && grep -Fq '"slug":"jyoti-paradise"' "$API" \
              && grep -Fq '"id":"model_jyoti_exterior_v1"' "$API" \
              && grep -Fq '"available":true' "$API" \
              && grep -Fq '"version":2' "$API" \
              && grep -Fq '"type":"wing-distance"' "$API" \
              && grep -Fq '"type":"typical-floor"' "$API" \
              && grep -Fq '"type":"amenity"' "$API" \
              && grep -Fq '"type":"section"' "$API" \
              && grep -Fq '"type":"balcony"' "$API" \
              && [ "$ASSET_STATUS" = "200" ] \
              && [[ "$ASSET_TYPE" == *javascript* ]]; then
              MODEL_PATH="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('model',{}).get('url',''))" "$API")"
              MODEL_STATUS="000"
              MODEL_TYPE=""
              if [ -n "$MODEL_PATH" ]; then
                MODEL_META="$(curl --location --silent --show-error --output /tmp/jyoti-live-model.glb --write-out '%{http_code}|%{content_type}' "${ORIGIN}${MODEL_PATH}" || true)"
                MODEL_STATUS="${MODEL_META%%|*}"
                MODEL_TYPE="${MODEL_META#*|}"
              fi
              [ "$MODEL_STATUS" = "200" ]
              [[ "$MODEL_TYPE" == *model/gltf-binary* || "$MODEL_TYPE" == *application/octet-stream* ]]
              test "$(head -c 4 /tmp/jyoti-live-model.glb)" = "glTF"
              echo "Public 3D project data, modules, JavaScript and live model verified."
              rm -f "$PAGE" "$API" /tmp/jyoti-live-model.glb
              exit 0
            fi
            echo "Attempt $attempt/5: page=$PAGE_STATUS api=$API_STATUS js=$ASSET_STATUS js_type=$ASSET_TYPE path=$ASSET_PATH"
            echo "API preview:"
            head -c 1000 "$API" || true
            echo
            rm -f "$PAGE" "$API"
            sleep 5
          done
          echo "::error::Public 3D production surface did not verify."
          exit 1

      # Jyoti Paradise remains a live smoke fixture only; admin selection itself is dynamic.
      - name: Verify legacy Jyoti admin production fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_SLUG="jyoti-paradise"
          PAGE_URL="https://admin.rekixo.com/3Dprojects"
          API_URL="https://admin.rekixo.com/3Dprojects/api/status?slug=${FIXTURE_SLUG}"
          ORIGIN="https://admin.rekixo.com"
          for attempt in 1 2 3 4 5; do
            PAGE="$(mktemp)"
            API="$(mktemp)"
            PAGE_STATUS="$(curl --location --silent --show-error --output "$PAGE" --write-out '%{http_code}' "$PAGE_URL" || true)"
            API_STATUS="$(curl --location --silent --show-error --output "$API" --write-out '%{http_code}' "$API_URL" || true)"
            ASSET_PATH="$(grep -oE 'src="/3Dprojects/assets/[^"]+\.js"' "$PAGE" | head -n1 | cut -d'"' -f2 || true)"
            ASSET_STATUS="000"
            ASSET_TYPE=""
            if [ -n "$ASSET_PATH" ]; then
              ASSET_META="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}|%{content_type}' "${ORIGIN}${ASSET_PATH}" || true)"
              ASSET_STATUS="${ASSET_META%%|*}"
              ASSET_TYPE="${ASSET_META#*|}"
            fi
            if [ "$PAGE_STATUS" = "200" ] \
              && grep -Fq '<title>Rekixo 3D Projects</title>' "$PAGE" \
              && [ "$API_STATUS" = "200" ] \
              && grep -Fq '"bucket":"rekixo-3d-assets"' "$API" \
              && grep -Fq '"id":"model_jyoti_exterior_v1"' "$API" \
              && grep -Fq '"type":"section"' "$API" \
              && [ "$ASSET_STATUS" = "200" ] \
              && [[ "$ASSET_TYPE" == *javascript* ]]; then
              echo "3D Admin source package, model record and JavaScript verified."
              rm -f "$PAGE" "$API"
              exit 0
            fi
            echo "Attempt $attempt/5: page=$PAGE_STATUS api=$API_STATUS js=$ASSET_STATUS js_type=$ASSET_TYPE path=$ASSET_PATH"
            echo "API preview:"
            head -c 1000 "$API" || true
            echo
            rm -f "$PAGE" "$API"
            sleep 5
          done
          echo "::error::3D Admin production surface did not verify."
          exit 1
