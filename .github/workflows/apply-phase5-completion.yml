name: Apply Phase 5 completion wiring

on:
  push:
    branches: [phase5-complete-visual-facade]
    paths:
      - scripts/phase5-ci-fixes.mjs
      - .github/workflows/apply-phase5-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase5-complete-visual-facade
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Phase 5 CI fixes
        run: node scripts/phase5-ci-fixes.mjs

      - name: Commit generated fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "rekixo-ci"
          git config user.email "ai@rekixo.com"
          git add apps/admin/src/studio/cadOnlyAutoBuildPipeline.ts
          git commit -m "fix: keep CAD-only visual summary compatible"
          git push origin HEAD:phase5-complete-visual-facade
