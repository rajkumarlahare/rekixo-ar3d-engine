name: Apply Phase 5 completion wiring

on:
  push:
    branches: [phase5-complete-visual-facade]
    paths:
      - scripts/apply-phase5-completion-v2.mjs
      - .github/workflows/apply-phase5-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase5-complete-visual-facade
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Phase 5 completion patch
        run: node scripts/apply-phase5-completion-v2.mjs

      - name: Commit generated wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "rekixo-ci"
          git config user.email "ai@rekixo.com"
          git add apps/admin/src/studio/domain.ts \
            workers/studio-draft-validation.mjs \
            apps/admin/src/studio/autoBuildPipelineLegacy.ts \
            apps/admin/src/studio/autoBuildPipeline.ts \
            apps/admin/src/studio/SceneCanvas.tsx \
            apps/admin/src/studio/Studio.tsx \
            apps/admin/src/studio/sceneReplayFingerprint.ts \
            apps/admin/src/studio/visualFacadeMatching.ts \
            e2e/golden-source-pack.spec.ts \
            docs/PERFECTION-ROADMAP-NEXT.md
          git commit -m "feat: complete Phase 5 visual facade workflow"
          git push origin HEAD:phase5-complete-visual-facade
