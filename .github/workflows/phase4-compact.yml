name: Phase 4 temporary SceneCanvas compactor

on:
  push:
    branches: [phase4-direct-object-drag]

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-direct-object-drag
          fetch-depth: 0
      - run: node scripts/phase4-compact-scene-canvas.mjs
      - name: Commit compact SceneCanvas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/studio/SceneCanvas.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: keep SceneCanvas within maintainability budget"
          git push origin HEAD:phase4-direct-object-drag
