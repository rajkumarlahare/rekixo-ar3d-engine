name: Phase 4 temporary SceneCanvas codemod

on:
  push:
    branches: [phase4-direct-object-drag]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase4-direct-object-drag
          fetch-depth: 0

      - name: Apply deterministic SceneCanvas patch
        run: node scripts/phase4-patch-scene-canvas.mjs

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- apps/admin/src/studio/SceneCanvas.tsx; then
            echo "No SceneCanvas changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/studio/SceneCanvas.tsx
          git commit -m "feat: wire direct object drag into SceneCanvas"
          git push origin HEAD:phase4-direct-object-drag
