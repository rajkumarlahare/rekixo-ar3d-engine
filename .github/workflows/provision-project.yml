name: Provision Rekixo AR3D Project

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Lowercase project slug, for example future-city
        required: true
        type: string
      name:
        description: Project display name
        required: true
        type: string
      location:
        description: Optional project location
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Render validated project SQL
        env:
          PROJECT_SLUG: ${{ inputs.slug }}
          PROJECT_NAME: ${{ inputs.name }}
          PROJECT_LOCATION: ${{ inputs.location }}
        run: node scripts/render-project-provision-sql.mjs "$PROJECT_SLUG" "$PROJECT_NAME" "$PROJECT_LOCATION" > /tmp/rekixo-3d-project.sql

      - name: Provision draft project in isolated Engine D1
        run: >-
          npx --no-install wrangler d1 execute rekixo-3d-production
          --remote
          --config wrangler.infra.jsonc
          --file /tmp/rekixo-3d-project.sql
