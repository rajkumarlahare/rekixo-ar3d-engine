name: Refactor Phase 5 SceneCanvas appearance

on:
  push:
    branches: [phase5-complete-visual-facade]
    paths:
      - scripts/refactor-phase5-appearance.mjs
      - .github/workflows/refactor-phase5-appearance.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase5-complete-visual-facade
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract appearance application
        run: node scripts/refactor-phase5-appearance.mjs
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No refactor changes."
            exit 0
          fi
          git config user.name "rekixo-ci"
          git config user.email "ai@rekixo.com"
          git add apps/admin/src/studio/SceneCanvas.tsx
          git commit -m "refactor: extract SceneCanvas appearance effect"
          git push origin HEAD:phase5-complete-visual-facade
