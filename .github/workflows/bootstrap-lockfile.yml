name: Bootstrap Rekixo AR3D Engine lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase-8-2-reproducible-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit exact lockfile to source branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
