name: Bootstrap Rekixo AR3D Engine lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rekixo-ar3d-engine-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
