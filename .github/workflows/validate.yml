name: Validate Rekixo AR3D Engine

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run test:bundles

      - name: Maintainability budgets
        run: npm run test:maintainability

      - name: Unit and integration tests
        run: node --test tests/*.test.mjs

      - name: Migration verification
        run: npm run test:migrations

      - name: Validate Admin Worker bundle and Wrangler config
        run: >-
          npx --no-install wrangler deploy
          --dry-run
          --config wrangler.admin.jsonc
          --outdir .wrangler-admin-dry-run

      - name: Validate Public Worker bundle and Wrangler config
        run: >-
          npx --no-install wrangler deploy
          --dry-run
          --config wrangler.public.jsonc
          --outdir .wrangler-public-dry-run

      - name: Install browser E2E runner
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser E2E smoke
        run: npx --no-install playwright test --config playwright.config.ts

      - name: Diff whitespace safety
        run: git diff --check origin/main...HEAD
